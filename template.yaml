# Metadatos de la plantilla para el catálogo de NoExpertise.
id: academia-formacion
nombre: Academia y formación
descripcion: Web fresca para academias, autoescuelas y centros de formación, con cursos, método e inscripción.
sectores: [academia, formacion, autoescuela, idiomas, oposiciones]
secciones:
  - { id: hero, nombre: Portada }
  - { id: cursos, nombre: Cursos }
  - { id: metodo, nombre: Método }
  - { id: profesores, nombre: Profesores }
  - { id: resultados, nombre: Resultados }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: inscripcion, nombre: Inscripción }
  - { id: contacto, nombre: Contacto }
estilo: fresco
plan_minimo: presencia
version: 1.1.0
base: astrowind
demo_url: https://demo-plantilla-academia-formacion.noexpertise.com
activa: true
orden: 120

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu academia"
    pregunta: "¿Cómo se llama tu academia y qué enseñáis?"
    ayuda: "Idiomas, oposiciones, refuerzo, autoescuela… y para quién."
    tipo: texto
    campos: [nombre, eslogan, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, secciones.hero.items, seo.descripcion]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.instagram, redes.facebook]
  - id: cursos
    titulo: "Tus cursos"
    pregunta: "Cuéntame los cursos que ofrecéis: nivel, duración, cuándo empiezan y el precio si quieres. Uno por línea."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.cursos.cursos]
  - id: metodo
    titulo: "Cómo enseñáis"
    pregunta: "¿Cómo son vuestras clases? Grupos, forma de trabajar, seguimiento…"
    tipo: texto
    campos: [secciones.metodo.titulo, secciones.metodo.texto, secciones.metodo.items]
  - id: profesores
    titulo: "Profesores"
    pregunta: "¿Quién da las clases? Nombre y qué enseña cada uno, uno por línea."
    ayuda: "Las fotos las pones luego en Contenido."
    tipo: lista
    campos: [secciones.profesores.personas]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: inscripcion
    titulo: "Inscripción"
    pregunta: "¿Cómo se apunta alguien? Qué tiene que hacer y qué pasa después."
    tipo: texto
    campos: [secciones.inscripcion.titulo, secciones.inscripcion.texto, secciones.inscripcion.items, secciones.inscripcion.nota]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.metodo.imagen, secciones.contacto.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
