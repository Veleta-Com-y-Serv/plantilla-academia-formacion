  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que más nos preguntan
    texto: "¿Tienes otra duda? Escríbenos y te respondemos el mismo día."
    cta: { texto: Hacer una pregunta, url: "/#contacto" }
    preguntas:
      - { pregunta: ¿Puedo probar una clase antes de apuntarme?, respuesta: "Sí. La primera clase es de prueba y no tiene coste ni compromiso." }
      - { pregunta: ¿Cómo sé qué nivel tengo?, respuesta: "Hacemos una prueba de nivel corta, oral y escrita, antes de empezar." }
      - { pregunta: ¿Hay matrícula?, respuesta: "No cobramos matrícula. Solo pagas la cuota del mes o del curso." }
      - { pregunta: ¿Qué pasa si falto a una clase?, respuesta: "Puedes recuperarla en otro grupo de tu nivel esa misma semana." }
      - { pregunta: ¿Las clases online son en directo?, respuesta: "Sí. Son en directo, con el mismo profesor y el mismo grupo reducido." }

